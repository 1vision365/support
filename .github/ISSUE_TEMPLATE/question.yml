name: Question
description: You need help with installation or usage
title: "[Question]: "
labels: ["needs-triage", "question"]
body:
  - type: markdown
    attributes:
      value: |
        This is a **public** repository. Do **not** post customer data, passwords, tokens or tenant IDs.
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - 1Vision IoT Link
        - 1Vision IoT-2-PrintVis Connector
        - 1Vision IoT-2-PrintVis Adapter - ifm moneo
        - 1Vision IoT-2-PrintVis Adapter - Moxa
        - Other 1Vision365 app
    validations:
      required: true
  - type: input
    id: bc_version
    attributes:
      label: Business Central version
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Keep it under roughly 2000 characters.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I did not include customer data, passwords, tokens or tenant IDs.
          required: true
        - label: I understand that an automated assistant may reply and that a team member may take over.
          required: true
