name: Bug report
description: Something does not work as expected
title: "[Bug]: "
labels: ["needs-triage", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is a **public** repository. Do **not** post customer data, passwords, tokens, tenant IDs or screenshots that contain sensitive data.
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - 1Vision IoT Link
        - 1Vision IoT-2-PrintVis Connector
        - 1Vision IoT-2-PrintVis Adapter - ifm moneo
        - 1Vision IoT-2-PrintVis Adapter - Moxa
        - Other 1Vision365 app
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: "e.g. 1.2.0.0"
    validations:
      required: true
  - type: input
    id: bc_version
    attributes:
      label: Business Central version
      placeholder: "e.g. 27.1 (SaaS)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What goes wrong?
      description: Keep it under roughly 2000 characters. Paste the error message verbatim.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I did not include customer data, passwords, tokens or tenant IDs.
          required: true
        - label: I understand that an automated assistant may reply and that a team member may take over.
          required: true
